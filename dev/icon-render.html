<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<title>Vykreslení ikony do PNG</title>
<style>
  html, body { margin:0; padding:0; background:transparent; width:100%; height:100%; }
  body { display:flex; align-items:center; justify-content:center; }
  body.paper { background:#fdfdfb; }
  svg { display:block; width:100%; height:100%; }
  body.inset svg { width:74%; height:74%; }
</style>
</head>
<body>
<!-- Kresba musí sedět s public/favicon.svg — při změně ikony překreslit obojí.
     Použití: /dev/icon-render.html          → průhledné pozadí, přes celou plochu
              /dev/icon-render.html?tile=1   → papírový podklad a odsazení (ikona na plochu) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <g transform="rotate(-2 16 16)">
    <path d="M16 9.4 C12.2 6.4 7.4 5.8 3.4 6.8 L3.4 24.4 C7.4 23.4 12.2 24 16 27 Z" fill="#fdfdfb" stroke="#3a3a3a" stroke-width="2.1" stroke-linejoin="round"/>
    <path d="M16 9.4 C19.8 6.4 24.6 5.8 28.6 6.8 L28.6 24.4 C24.6 23.4 19.8 24 16 27 Z" fill="#fdfdfb" stroke="#3a3a3a" stroke-width="2.1" stroke-linejoin="round"/>
    <path d="M6.6 12.4 h6.2" stroke="#fbe3a3" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M6.6 17.6 h4.4" stroke="#e2ddcf" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M19.2 12.6 h6.2" stroke="#f3cdd6" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M19.2 17.8 h4.4" stroke="#e2ddcf" stroke-width="2.2" stroke-linecap="round"/>
  </g>
</svg>
<script>
  if (new URLSearchParams(location.search).has('tile')) {
    document.body.className = 'paper inset';
  }
</script>
</body>
</html>
